[project]
name = "azurlane-bot"
version = "0.1.0"
description = "碧蓝航线 NoneBot2 机器人：指挥官信息 / 建造记录查询，Web 界面登录绑定"
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-htmlrender>=0.8.0",
    "nonebot-plugin-localstore>=0.7.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[tool.nonebot]
plugins = ["src.plugins.azurlane"]
driver = "~fastapi+~websockets"
host = "127.0.0.1"
port = 8081
