<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "SourceHanSans", "Microsoft YaHei", "PingFang SC", sans-serif;
    width: 540px;
    padding: 0;
    background: transparent;
  }

  .page {
    position: relative;
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: linear-gradient(165deg, #1a3a6b 0%, #0f2a52 45%, #0a1e3d 100%);
  }
  .bg-blur {
    position: absolute;
    inset: -40px;
    z-index: 0;
    background-size: cover;
    background-position: center 30%;
    filter: blur(22px) saturate(1.2);
    opacity: 0.5;
  }
  .bg-tint {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg, rgba(10, 25, 50, 0.35) 0%, rgba(8, 20, 40, 0.55) 100%);
  }
  .content { position: relative; z-index: 2; }

  .masthead {
    padding: 12px 18px 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }
  .brand img { height: 26px; width: auto; display: block; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.4)); }

  .hero {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 14px 16px 0;
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 14px;
  }
  .avatar-wrap { width: 56px; height: 56px; flex-shrink: 0; }
  .avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }
  .title h1 {
    font-size: 19px;
    font-weight: 800;
    font-family: "MStiffHei", "Microsoft YaHei", sans-serif;
    color: #ffffff;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  }
  .title .sub { margin-top: 3px; font-size: 11.5px; color: rgba(215, 232, 255, 0.75); letter-spacing: 0.5px; }

  .list { padding: 12px 16px 6px; }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    margin-bottom: 7px;
    background: rgba(255, 255, 255, 0.13);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px;
  }
  .idx {
    width: 20px;
    text-align: right;
    font-size: 11.5px;
    color: rgba(215, 232, 255, 0.55);
    font-family: "Consolas", monospace;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .ship-icon {
    width: 40px; height: 40px;
    border-radius: 8px;
    object-fit: cover;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    flex-shrink: 0;
  }
  .ship-name { flex: 1; font-size: 14.5px; font-weight: 700; font-family: "MStiffHei", "Microsoft YaHei", sans-serif; color: #eaf3ff; letter-spacing: 0.5px; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }
  .task { font-size: 11.5px; color: rgba(215, 232, 255, 0.7); margin-right: 10px; }
  .rarity {
    font-size: 11.5px;
    font-weight: 700;
    border-radius: 5px;
    padding: 2px 8px;
    letter-spacing: 1px;
    flex-shrink: 0;
    min-width: 52px;
    text-align: center;
    border: 1px solid;
  }
  .rarity.ssr { color: #ffd76a; background: rgba(255, 215, 106, 0.18); border-color: rgba(255, 215, 106, 0.45); }
  .rarity.sr  { color: #d0a8ff; background: rgba(208, 168, 255, 0.16); border-color: rgba(208, 168, 255, 0.4); }
  .rarity.r   { color: #9fd0ff; background: rgba(159, 208, 255, 0.15); border-color: rgba(159, 208, 255, 0.38); }
  .rarity.n   { color: #b8c2d0; background: rgba(184, 194, 208, 0.13); border-color: rgba(184, 194, 208, 0.32); }

  .foot {
    padding: 11px 18px 13px;
    display: flex;
    justify-content: space-between;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    margin-top: 6px;
  }
  .foot .l { font-size: 11px; font-family: "Agency", sans-serif; color: rgba(215, 232, 255, 0.45); letter-spacing: 2px; }
  .foot .r { font-size: 10px; color: rgba(215, 232, 255, 0.35); font-family: "Consolas", monospace; }
</style>
</head>
<body>
  <div class="page">
    <div class="bg-blur" style="background-image: url('{{avatar}}');"></div>
    <div class="bg-tint"></div>

    <div class="content">
      <div class="masthead">
        <span class="brand"><img src="{{logo}}" alt="" /></span>
      </div>

      <div class="hero">
        <div class="avatar-wrap"><img class="avatar" src="{{avatar}}" alt="" /></div>
        <div class="title">
          <h1>{{nickname}} 的建造记录</h1>
          <div class="sub">本次展示 {{fetched}} 条 · 服务器共 {{total_count}} 条</div>
        </div>
      </div>

      <div class="list">
        {{rows}}
      </div>

      <div class="foot">
        <span class="l">AZURLANE FLEET COMMAND</span>
        <span class="r">DATA · LE3-API</span>
      </div>
    </div>
  </div>
</body>
</html>
